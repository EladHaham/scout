[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-repomap"
version = "0.1.0"
description = "A small CLI that returns an Aider repo map for a git repository"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Elad Haham" }
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.25.0",
]

[project.scripts]
scout = "scout.cli:main"
scout-mcp = "scout.mcp.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["scout", "scout.*"]
exclude = ["scout-app*", "dashboard*", "tests*"]